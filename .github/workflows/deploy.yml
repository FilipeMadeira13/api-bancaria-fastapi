name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-bancaria-fastapi:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_USERNAME != ''

      - name: Push to Docker Hub
        run: |
          docker tag api-bancaria-fastapi:latest ${{ secrets.DOCKER_USERNAME }}/api-bancaria-fastapi:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/api-bancaria-fastapi:latest
        if: secrets.DOCKER_USERNAME != ''

      - name: Deploy to Railway (Optional)
        run: |
          echo "Configure Railway deployment in .railway.json"
          echo "Or use Railway CLI: railway up"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deploy completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: secrets.SLACK_WEBHOOK != ''

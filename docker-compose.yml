version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-bancaria
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite+aiosqlite:///./bank.db
      SQL_ECHO: ${SQL_ECHO:-false}
    volumes:
      - ./bank.db:/app/bank.db
      - ./app:/app/app  # Hot reload em desenvolvimento
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - api-network
    restart: unless-stopped

networks:
  api-network:
    driver: bridge

volumes:
  bank_db:
    driver: local
